# Publishes the wagglebot npm package when a GitHub release is created
# (bin/release creates it). Uses npm trusted publishing: the OIDC token
# of this workflow is the credential, so no npm token exists anywhere.
# One-time setup on npmjs.com: package settings → Trusted Publisher →
# GitHub Actions → repository swiknaba/wagglebot, workflow release.yml.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Node 22 bundles npm 10.x,
      # which has no OIDC support and would ask for a token that does not exist.
      # Pin the major: npm 12 already warns on some Node 22 versions, and a
      # release pipeline must not change behavior when a new npm ships.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version
        working-directory: .
      - name: Verify that the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json $PKG_VERSION."
            exit 1
          fi
          REFERENCE_VERSION="$(node -p "require('./examples/reference-setup/package.json').dependencies.wagglebot")"
          if [ "$TAG_VERSION" != "$REFERENCE_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match the reference setup pin $REFERENCE_VERSION."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      # packages/cli/package.json has workspace dependencies for monorepo builds.
      # The pack script stages a self-contained release manifest and bundles its
      # runtime dependencies. Publish only that tarball, never a raw npm pack.
      - name: Stage the release tarball
        working-directory: packages/cli
        run: |
          bun run pack "$RUNNER_TEMP"
          tarballs=("$RUNNER_TEMP"/wagglebot-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one staged wagglebot tarball."
            exit 1
          fi
          printf '%s\n' "${tarballs[0]}" > "$RUNNER_TEMP/wagglebot-tarball"
      - name: Verify the staged publish artifact
        run: |
          TARBALL="$(cat "$RUNNER_TEMP/wagglebot-tarball")"
          if ! tar -tzf "$TARBALL" | grep -qx "package/dist/index.js"; then
            echo "The tarball does not ship dist/index.js. It ships:"
            tar -tzf "$TARBALL"
            exit 1
          fi
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/wagglebot-package.json"
          node -e 'const pkg = require(process.argv[1]); if (Object.values(pkg.dependencies ?? {}).some((version) => version.startsWith("workspace:"))) process.exit(1)' "$RUNNER_TEMP/wagglebot-package.json"
      - name: Clean-install the staged publish artifact
        run: |
          TARBALL="$(cat "$RUNNER_TEMP/wagglebot-tarball")"
          SMOKE_DIR="$RUNNER_TEMP/wagglebot-install"
          npm install --prefix "$SMOKE_DIR" --no-save --no-package-lock "$TARBALL"
          "$SMOKE_DIR/node_modules/.bin/wagglebot" --version | grep -Fx "${GITHUB_REF_NAME#v}"
      - name: Publish to npm with provenance
        run: npm publish "$(cat "$RUNNER_TEMP/wagglebot-tarball")" --provenance --access public
      - name: Verify published reference provisioning
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SMOKE_HOME="$RUNNER_TEMP/wagglebot-reference-home"
          SMOKE_PREFIX="$RUNNER_TEMP/wagglebot-reference-bootstrap"
          mkdir -p "$SMOKE_HOME"
          export HOME="$SMOKE_HOME"
          git config --global wagglebot.username release-smoke
          npm install --prefix "$SMOKE_PREFIX" --no-save --no-package-lock "wagglebot@$TAG_VERSION"
          BOOTSTRAP="$SMOKE_PREFIX/node_modules/.bin/wagglebot"
          "$BOOTSTRAP" connect "$GITHUB_WORKSPACE" examples/reference-setup
          "$BOOTSTRAP" update --wagglebot
          test -f "$HOME/.wagglebot/runtime/$TAG_VERSION/node_modules/wagglebot/bin/wagglebot.js"
          test -f "$HOME/.agents/skills/brainstorming/SKILL.md"
