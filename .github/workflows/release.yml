# Publishes the wagglebot npm package when a GitHub release is created
# (bin/release creates it). Uses npm trusted publishing: the OIDC token
# of this workflow is the credential, so no npm token exists anywhere.
# One-time setup on npmjs.com: package settings → Trusted Publisher →
# GitHub Actions → repository swiknaba/wagglebot, workflow release.yml.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (D13)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (D13)
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify that the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json $PKG_VERSION."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Build the bundle
        run: bun run build
      - name: Assert the tarball ships the built bundle
        run: |
          test -f dist/index.js
          npm pack --dry-run | grep -q dist/index.js
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
