# Publishes the wagglebot npm package when a GitHub release is created
# (bin/release creates it). Uses npm trusted publishing: the OIDC token
# of this workflow is the credential, so no npm token exists anywhere.
# One-time setup on npmjs.com: package settings → Trusted Publisher →
# GitHub Actions → repository swiknaba/wagglebot, workflow release.yml.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Node 22 bundles npm 10.x,
      # which has no OIDC support and would ask for a token that does not exist.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
        working-directory: .
      - name: Verify that the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json $PKG_VERSION."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Build the bundle
        run: bun run build
      # "npm pack --dry-run" prints the file list on stderr and only the tarball
      # name on stdout, so grepping stdout never matches. Read the machine
      # readable file list instead.
      - name: Assert the tarball ships the built bundle
        run: |
          test -f dist/index.js
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const pack = require(process.env.RUNNER_TEMP + "/pack.json");
            const files = pack[0].files.map((f) => f.path);
            if (!files.includes("dist/index.js")) {
              console.error("The tarball does not ship dist/index.js. It ships:");
              console.error(files.join("\n"));
              process.exit(1);
            }
            console.log("The tarball ships dist/index.js.");
          '
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
