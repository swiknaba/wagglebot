# EDIT: replace every example entity with your own organization.
# One file per team lives in catalogs/. wagglebot merges all files into one catalog.
# A small team can delete catalogs/ and keep a single catalog.yaml at the
# repository root instead.
# The catalog is the single source of truth. An unknown name is a hard error.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: payments
spec:
  owner: team-payments
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: payments-platform
spec:
  owner: team-payments
  domain: payments
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-payments
spec:
  type: team
  members: [alice, bob]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alice
  annotations:
    wagglebot.dev/org-owner: "true"
spec:
  memberOf: [team-payments]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: bob
spec:
  memberOf: [team-payments]
